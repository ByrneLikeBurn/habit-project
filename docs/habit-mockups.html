<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit — design mockups</title>
<style>
:root{
  --paper:#FBFAF6;
  --ink:#16130F;
  --ink-70:rgba(22,19,15,.70);
  --ink-45:rgba(22,19,15,.60);
  --rule:rgba(22,19,15,.16);
  --rule-soft:rgba(22,19,15,.09);
  --mark:#16130F;
  --desk:#E8E4DC;
  --frame:rgba(22,19,15,.22);
  --serif:"Iowan Old Style","Palatino Linotype","Hoefler Text","Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --paper:#14120F;
  --ink:#F2EEE5;
  --ink-70:rgba(242,238,229,.70);
  --ink-45:rgba(242,238,229,.52);
  --rule:rgba(242,238,229,.18);
  --rule-soft:rgba(242,238,229,.10);
  --mark:#F2EEE5;
  --desk:#0B0A08;
  --frame:rgba(242,238,229,.20);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{
  margin:0;background:var(--desk);color:var(--ink);
  font-family:var(--sans);
  transition:background .25s ease;
}

/* ---------- page chrome ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;
  padding:14px 26px;
  background:color-mix(in srgb,var(--desk) 88%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
}
.bar h1{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
.bar .sub{font-size:12px;color:var(--ink-45);margin-left:-10px}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-70)}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{
  font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;
  color:var(--ink-70);cursor:pointer
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.swatches{display:flex;gap:7px}
.sw{width:19px;height:19px;border-radius:50%;border:1px solid var(--frame);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--desk),0 0 0 3px var(--ink)}

main{padding:34px 26px 90px;max-width:1520px;margin:0 auto}
.sectiontitle{
  font-family:var(--serif);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-45);margin:46px 0 20px;display:flex;align-items:center;gap:14px
}
.sectiontitle:first-child{margin-top:0}
.sectiontitle::after{content:"";flex:1;height:1px;background:var(--rule)}

.grid{display:flex;flex-wrap:wrap;gap:30px}
.cell{width:376px}
.cell.wide{width:auto}
.cap{margin-top:12px;font-size:12px;line-height:1.55;color:var(--ink-45);max-width:376px}
.cap b{color:var(--ink-70);font-weight:600}

/* ---------- device frames ---------- */
.phone{
  width:376px;height:812px;border-radius:46px;background:var(--paper);
  border:1px solid var(--frame);position:relative;overflow:hidden;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;border-radius:16px;background:var(--ink);opacity:.9;z-index:9
}
.status{
  height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 4px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em
}
.status .r{display:flex;gap:5px;align-items:center;opacity:.85}
.home{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:132px;height:4px;border-radius:2px;background:var(--ink);opacity:.28
}
.screen{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow:hidden;padding:0 26px}

/* ---------- typography ---------- */
.eyebrow{
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-45)
}
.display{font-family:var(--serif);font-size:32px;line-height:1.12;font-weight:500;letter-spacing:-.01em;margin:6px 0 0}
.title{font-family:var(--serif);font-size:22px;font-weight:500;margin:0}
.body{font-size:15px;line-height:1.55;color:var(--ink-70)}
.small{font-size:13px;line-height:1.5;color:var(--ink-45)}
.rule{height:1px;background:var(--rule-soft);margin:0}

/* ---------- nav ---------- */
.navbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:6px 26px 14px
}
.tabbar{
  flex:none;display:flex;justify-content:space-around;align-items:center;
  padding:12px 26px 26px;border-top:1px solid var(--rule-soft)
}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-45);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tab.on{color:var(--mark)}
.tab svg{width:22px;height:22px}

/* ---------- habit row ---------- */
.row{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.icon{width:34px;height:34px;flex:none;color:var(--ink)}
.icon svg{width:100%;height:100%;display:block}
.rowmain{flex:1;min-width:0}
.rowname{font-family:var(--serif);font-size:17px;line-height:1.25}
.rowmeta{font-size:12px;color:var(--ink-45);margin-top:3px;display:flex;align-items:center;gap:7px}
.dotsep{width:2px;height:2px;border-radius:50%;background:var(--ink-45)}
.done .rowname{opacity:.42;text-decoration:line-through;text-decoration-thickness:.5px}
.done .icon{opacity:.4}

/* check control — hand-drawn circle */
.check{width:30px;height:30px;flex:none;position:relative;color:var(--mark)}
.check svg{width:100%;height:100%}

/* tally marks for counted habits */
.tally{display:flex;gap:4px;align-items:flex-end;height:18px}
.tally i{display:block;width:2px;height:14px;background:var(--mark);opacity:.16;border-radius:1px}
.tally i.f{opacity:1}
.stepper{display:flex;align-items:center;gap:11px}
.stepbtn{
  width:27px;height:27px;border-radius:50%;border:1px solid var(--rule);
  background:transparent;color:var(--ink-70);font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif)
}
.count{font-family:var(--serif);font-size:15px;min-width:34px;text-align:center;color:var(--ink-70)}

/* ---------- heat map ---------- */
.hm{display:grid;gap:4px}
.cellsq{
  aspect-ratio:1;border-radius:2px;position:relative;
  border:1px solid var(--rule-soft);
}
.cellsq[data-l="0"]{background:transparent}
.cellsq[data-l="1"]{background:repeating-linear-gradient(45deg,var(--mark) 0 .55px,transparent .55px 7.5px);opacity:.75}
.cellsq[data-l="2"]{background:repeating-linear-gradient(45deg,var(--mark) 0 .7px,transparent .7px 5px);opacity:.82}
.cellsq[data-l="3"]{background:repeating-linear-gradient(45deg,var(--mark) 0 .85px,transparent .85px 3.2px);opacity:.9}
.cellsq[data-l="4"]{background:var(--mark);border-color:var(--mark);opacity:.94}
.cellsq.today{box-shadow:0 0 0 1.5px var(--ink);border-color:transparent}
/* below ~11px a hatch reads as static, so small grids fall back to ink density */
.hm.tiny .cellsq{border-color:var(--rule-soft)}
.hm.tiny .cellsq[data-l="1"]{background:var(--mark);opacity:.20}
.hm.tiny .cellsq[data-l="2"]{background:var(--mark);opacity:.44}
.hm.tiny .cellsq[data-l="3"]{background:var(--mark);opacity:.70}
.hm.tiny .cellsq[data-l="4"]{background:var(--mark);opacity:.95}
/* paused: a ledger dash — "no entry expected", not "you failed" */
.cellsq.paused{background:transparent!important;border-color:var(--rule);opacity:1}
.cellsq.paused::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:46%;height:1.6px;background:var(--mark);opacity:.55;border-radius:1px}
.cellsq.off{border-color:transparent;background:transparent!important}
/* extra credit: done on a day it wasn't asked of you */
.cellsq.extra{background:transparent!important;border-color:var(--rule);opacity:1}
.cellsq.extra::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:34%;
  background:var(--mark);transform:translate(-50%,-50%) rotate(45deg)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:1.6}
.codebox{border:1px solid var(--rule);border-radius:11px;padding:12px 13px;background:var(--rule-soft)}
.danger{border-color:var(--ink);color:var(--ink)}
.nowline{display:flex;align-items:center;gap:11px;padding:16px 0 6px;color:var(--ink-45);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.nowline::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.3}
.box{border:1px solid var(--rule);border-radius:14px;padding:15px}
.cbrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.cb{width:21px;height:21px;border-radius:5px;border:1.3px solid var(--rule);flex:none;position:relative}
.cb.on{background:var(--mark);border-color:var(--mark)}
.cb.on::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:10px;
  border:solid var(--paper);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.step{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--rule-soft)}
.stepno{width:25px;height:25px;border-radius:50%;border:1px solid var(--ink);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px}
.cellsq.future{opacity:.3;border-style:dashed}
.hmlabels{display:grid;gap:4px;font-size:9px;color:var(--ink-45);text-align:center;letter-spacing:.08em;margin-bottom:6px}
.legend{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink-45);margin-top:14px}
.legend .cellsq{width:17px;height:17px;aspect-ratio:auto;flex:none}

/* ---------- misc ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:15px;border-radius:14px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:16px;cursor:pointer
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.field{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 0;border-bottom:1px solid var(--rule-soft)
}
.field .lab{font-size:15px}
.field .val{font-size:15px;color:var(--ink-45);display:flex;align-items:center;gap:7px}
.switch{width:44px;height:26px;border-radius:13px;border:1px solid var(--rule);position:relative;flex:none}
.switch.on{background:var(--mark);border-color:var(--mark)}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--paper);border:1px solid var(--rule);transition:.2s
}
.switch.on::after{left:auto;right:2px;border-color:transparent}
.chip{
  border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-70)
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}

.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--rule);border-radius:26px 26px 0 0;padding:12px 26px 34px;
  box-shadow:0 -20px 50px -30px rgba(0,0,0,.6)
}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 18px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.34)}

.banner{
  position:absolute;top:14px;left:12px;right:12px;border-radius:20px;
  background:color-mix(in srgb,var(--paper) 90%,var(--ink));
  border:1px solid var(--rule);padding:13px 15px;display:flex;gap:12px;align-items:center;
  box-shadow:0 14px 34px -18px rgba(0,0,0,.6);z-index:20
}

.watch{
  width:198px;height:240px;border-radius:46px;background:#000;border:1px solid var(--frame);
  padding:9px;box-shadow:0 20px 44px -24px rgba(0,0,0,.6)
}
.watchscreen{
  width:100%;height:100%;border-radius:38px;background:#000;color:#F2EEE5;overflow:hidden;
  padding:14px 13px;font-size:12px;position:relative
}
.widget{
  width:170px;height:170px;border-radius:26px;background:var(--paper);border:1px solid var(--frame);
  padding:16px;box-shadow:0 14px 34px -22px rgba(0,0,0,.5)
}
.widget.med{width:364px}
.mac{
  width:900px;border-radius:14px;overflow:hidden;background:var(--paper);
  border:1px solid var(--frame);box-shadow:0 26px 60px -32px rgba(0,0,0,.55)
}
.mactop{display:flex;gap:7px;padding:12px 15px;border-bottom:1px solid var(--rule-soft)}
.mactop i{width:11px;height:11px;border-radius:50%;border:1px solid var(--rule);display:block}
.macbody{display:flex;height:520px}
.sidebar{width:228px;border-right:1px solid var(--rule-soft);padding:20px 16px}
.sideitem{padding:8px 11px;border-radius:8px;font-size:14px;color:var(--ink-70);display:flex;gap:10px;align-items:center}
.sideitem.on{background:var(--rule-soft);color:var(--ink)}
.sideitem svg{width:17px;height:17px}
</style>
</head>
<body>

<div class="bar">
  <h1>Habit</h1>
  <span class="sub">design mockups · v1</span>
  <div class="ctl">
    <span>Appearance</span>
    <div class="seg" id="themeSeg">
      <button aria-pressed="true" data-t="light">Paper</button>
      <button aria-pressed="false" data-t="dark">Ink</button>
    </div>
  </div>
  <div class="ctl">
    <span>Accent</span>
    <div class="swatches" id="accents"></div>
  </div>
  <div class="ctl"><span id="hint">Tap circles and heat-map ranges — they work.</span></div>
</div>

<main id="app"></main>

<script>
/* ============================================================
   ICONS — pen-and-ink line art, 48×48, stroked not filled
   ============================================================ */
const S = (p,extra="") => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}${extra}</svg>`;

const ICONS = {
  water: S(`<path d="M15.6 13h16.8l-2.2 26c-.15 1.8-1.65 3.2-3.45 3.2h-5.5c-1.8 0-3.3-1.4-3.45-3.2z"/>

  sit: S(`<circle cx="24" cy="11.4" r="3.9"/>
    <path d="M19.4 22.6c.5-3.1 2.3-5.4 4.6-5.4s4.1 2.3 4.6 5.4"/>

  moon: S(`<path d="M31.8 10.8C24.3 12.6 19 19.3 19 27.2c0 5.6 2.7 10.6 6.9 13.7-.9.1-1.9.2-2.9.2-8.9 0-16.1-7.2-16.1-16.1S14.1 8.9 23 8.9c3.1 0 6.1.9 8.8 1.9z"/>

    <path d="M24 8.4v4.6M24 35v4.6M8.4 24h4.6M35 24h4.6M13 13l3.3 3.3M31.7 31.7l3.3 3.3M35 13l-3.3 3.3M16.3 31.7L13 35"/>

    <rect x="26.6" y="9.4" width="12" height="12" rx="1.6" fill="currentColor" opacity=".85"/>
    <rect x="9.4" y="26.6" width="12" height="12" rx="1.6" fill="currentColor" opacity=".4"/>

  gear: S(`<circle cx="24" cy="24" r="5.4"/>
    <path d="M24 7.4v4.2M24 36.4v4.2M40.6 24h-4.2M11.6 24H7.4M35.7 12.3l-3 3M15.3 32.7l-3 3M35.7 35.7l-3-3M15.3 15.3l-3-3"/>
    <circle cx="24" cy="24" r="12.6" opacity=".3"/>`),
  plus: S(`<path d="M24 12v24M12 24h24"/>`),
  chev: S(`<path d="M19 13l11 11-11 11"/>`),
  back: S(`<path d="M29 13L18 24l11 11"/>`),
};

const CHECK_EMPTY = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">

/* deterministic pseudo-random so the mockup is stable */
let _s = 20260801;
function rnd(){ _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s/0x7fffffff; }
function level(i, bias=0){
  const r = rnd();
  if(r < .16 - bias*.05) return 0;
  if(r < .33) return 1;
  if(r < .52) return 2;
  if(r < .74) return 3;
  return 4;
}

}

function heatmap(range, id){
  if(range==="week"){
    const days=["M","T","W","T","F","S","S"];
    let cells="", labels="";
    for(let i=0;i<7;i++){
      const l = i>4 ? (i===6?0:2) : level(i,1);
      labels += `<div>${days[i]}</div>`;
      cells += `<div class="cellsq ${i===4?'today':''} ${i>4?'future':''}" data-l="${i>4?0:l}"
        title="${l*25}%"></div>`;
    }
    return `<div class="hmlabels" style="grid-template-columns:repeat(7,1fr)">${labels}</div>
            <div class="hm" style="grid-template-columns:repeat(7,1fr)">${cells}</div>`;
  }
  if(range==="month"){
    const days=["M","T","W","T","F","S","S"];
    let cells="", labels=days.map(d=>`<div>${d}</div>`).join("");
    for(let i=0;i<35;i++){
      const future = i>25;
      cells += `<div class="cellsq ${i===25?'today':''} ${future?'future':''}" data-l="${future?0:level(i)}"></div>`;
    }
    return `<div class="hmlabels" style="grid-template-columns:repeat(7,1fr)">${labels}</div>
            <div class="hm" style="grid-template-columns:repeat(7,1fr)">${cells}</div>`;
  }
  // year
  let cells="";
  for(let i=0;i<7*30;i++){
    const future = i>7*26;
    cells += `<div class="cellsq ${future?'future':''}" data-l="${future?0:level(i)}" style="border-radius:1.5px"></div>`;
  }
  return `<div class="hm tiny" style="grid-template-columns:repeat(30,1fr);gap:2.5px;grid-auto-flow:column;grid-template-rows:repeat(7,1fr)">${cells}</div>
    <div class="small" style="margin-top:8px;display:flex;justify-content:space-between"><span>Feb</span><span>Apr</span><span>Jun</span><span>Aug</span></div>`;
}

document.getElementById("themeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  document.documentElement.dataset.theme = b.dataset.t;
  [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
});

const ACCENTS = [["Ink","#16130F","#F2EEE5"],["Sepia","#7A4A2B","#C9A07A"],["Slate","#2F4F6E","#8FB3D0"],
                 ["Oxblood","#6B2E3A","#C98F9B"],["Moss","#3B5741","#94BBA0"],["Iris","#4A3A6B","#A99AD0"]];
const accWrap = document.getElementById("accents");
accWrap.innerHTML = ACCENTS.map(([n,l,d],i)=>
  `<button class="sw" title="${n}" data-l="${l}" data-d="${d}" aria-pressed="${i===0}" style="background:${l}"></button>`).join("");
accWrap.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  [...accWrap.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.style.setProperty("--mark", dark ? b.dataset.d : b.dataset.l);
  accWrap.dataset.l = b.dataset.l; accWrap.dataset.d = b.dataset.d;
});
document.getElementById("themeSeg").addEventListener("click", ()=>{
  if(!accWrap.dataset.l) return;
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.style.setProperty("--mark", dark ? accWrap.dataset.d : accWrap.dataset.l);
});

/* check toggles */
app.addEventListener("click", e=>{
  const c = e.target.closest("[data-check]"); if(!c) return;
  const on = c.getAttribute("aria-checked") === "true";
  c.setAttribute("aria-checked", String(!on));
  c.innerHTML = on ? CHECK_EMPTY : CHECK_DONE;
  c.closest("[data-row]").classList.toggle("done", !on);
});

/* heat map range */

  _s = 20260801;
  wrap.parentElement.querySelector("[data-hm]").innerHTML = heatmap(chip.dataset.r);
});
