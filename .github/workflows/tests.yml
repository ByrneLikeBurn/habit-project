name: Tests

on:
  push:
  pull_request:

jobs:
  swift-test:
    name: swift test (HabitKit)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Swift version
        run: swift --version

      - name: Run HabitKit tests
        working-directory: HabitKit
        run: swift test
